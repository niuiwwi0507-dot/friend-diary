
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리의 교환일기</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background: #f7f0e8;
      color: #51463f;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 28px;
      background: #fffdf9;
      border: 1px solid #eadfd4;
      border-radius: 20px;
      box-shadow: 0 8px 30px #75604a12;
    }

    h1, .subtitle { text-align: center; }
    h1 { font-size: 27px; }
    .subtitle { color: #9a8879; margin-bottom: 28px; }
    h2 { font-size: 18px; margin-top: 24px; }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 13px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #e5d8cc;
      border-radius: 9px;
      background: white;
      font: inherit;
    }

    textarea { min-height: 120px; resize: vertical; }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #b98f76;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover { background: #a67b63; }
    .secondary { background: #d7c2b2; color: #51463f; }
    .divider { margin: 26px 0; border-top: 1px solid #eee3d9; }
    #message { text-align: center; line-height: 1.6; color: #8b6651; }
    #diary { display: none; }
    .entry {
      padding: 14px;
      margin: 12px 0;
      background: #faf3ed;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }
    .entry small { color: #9a8879; }
    .entry p { white-space: pre-wrap; }
  </style>
</head>
<body>
  <main class="container">
    <h1>우리의 교환일기</h1>
    <p class="subtitle">우리 둘만의 작은 기록장</p>

    <section id="roomForm">
      <h2>새로운 일기방 만들기</h2>

      <label for="newRoom">방 이름</label>
      <input id="newRoom" maxlength="60" placeholder="우리만의 방 이름">

      <label for="newPassword">방 비밀번호 (6자 이상)</label>
      <input id="newPassword" type="password" autocomplete="new-password"
        placeholder="비밀번호 입력">

      <label for="newNickname">내 닉네임</label>
      <input id="newNickname" maxlength="40" placeholder="일기에서 사용할 이름">

      <button onclick="createRoom()">방 만들기</button>

      <div class="divider"></div>

      <h2>만들어진 일기방 입장하기</h2>

      <label for="joinRoom">방 이름</label>
      <input id="joinRoom" maxlength="60" placeholder="친구에게 받은 방 이름">

      <label for="joinPassword">방 비밀번호</label>
      <input id="joinPassword" type="password" autocomplete="current-password"
        placeholder="방 비밀번호 입력">

      <label for="joinNickname">내 닉네임</label>
      <input id="joinNickname" maxlength="40" placeholder="내 닉네임">

      <button onclick="joinRoom()">일기방 입장</button>
    </section>

    <section id="diary">
      <div class="divider"></div>
      <h2 id="roomTitle">우리의 일기</h2>
      <p id="whoAmI"></p>

      <label for="diaryText">오늘의 일기</label>
      <textarea id="diaryText" maxlength="5000"
        placeholder="오늘 있었던 일을 적어 봐."></textarea>
      <button onclick="writeEntry()">일기 저장하기</button>
      <button class="secondary" onclick="loadEntries()">일기 새로고침</button>
      <button class="secondary" onclick="leaveRoom()">방 나가기</button>

      <h2>우리의 기록</h2>
      <div id="entries"></div>
    </section>

    <p id="message" aria-live="polite">두 사람의 이야기를 기록해 보세요.</p>
  </main>

  <script>
    let currentRoom = "";
    let currentPassword = "";
    let currentNickname = "";

    async function request(action, extra = {}) {
      const response = await fetch("/api/room", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action,
          roomName: currentRoom,
          password: currentPassword,
          nickname: currentNickname,
          ...extra
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "요청에 실패했어요.");
      }

      return data;
    }

    function showMessage(message) {
      document.getElementById("message").textContent = message;
    }

    function openDiary() {
      document.getElementById("roomForm").style.display = "none";
      document.getElementById("diary").style.display = "block";
      document.getElementById("roomTitle").textContent =
        currentRoom + " — 교환일기";
      document.getElementById("whoAmI").textContent =
        "내 닉네임: " + currentNickname;
    }

    async function createRoom() {
      currentRoom = document.getElementById("newRoom").value.trim();
      currentPassword = document.getElementById("newPassword").value;
      currentNickname = document.getElementById("newNickname").value.trim();

      if (!currentRoom || !currentNickname || currentPassword.length < 6) {
        showMessage("방 이름과 닉네임을 입력하고 비밀번호는 6자 이상으로 설정해 줘.");
        return;
      }

      try {
        await request("create");
        openDiary();
        showMessage("방을 만들었어! 친구에게 방 이름과 비밀번호를 알려 줘.");
        await loadEntries();
      } catch (error) {
        showMessage(error.message);
      }
    }

    async function joinRoom() {
      currentRoom = document.getElementById("joinRoom").value.trim();
      currentPassword = document.getElementById("joinPassword").value;
      currentNickname = document.getElementById("joinNickname").value.trim();

      if (!currentRoom || !currentNickname || !currentPassword) {
        showMessage("방 이름, 비밀번호, 닉네임을 모두 입력해 줘.");
        return;
      }

      try {
        await request("join");
        openDiary();
        showMessage("일기방에 입장했어!");
        await loadEntries();
      } catch (error) {
        showMessage(error.message);
      }
    }

    async function writeEntry() {
      const content = document.getElementById("diaryText").value.trim();

      if (!content) {
        showMessage("일기 내용을 먼저 입력해 줘.");
        return;
      }

      try {
        await request("write", { content });
        document.getElementById("diaryText").value = "";
        showMessage("일기를 저장했어!");
        await loadEntries();
      } catch (error) {
        showMessage(error.message);
      }
    }

    async function loadEntries() {
      try {
        const data = await request("read");
        const list = document.getElementById("entries");
        list.replaceChildren();

        if (!data.entries || data.entries.length === 0) {
          list.textContent = "아직 작성된 일기가 없어. 첫 일기를 써 봐!";
          return;
        }

        for (const item of data.entries) {
          const article = document.createElement("article");
          article.className = "entry";

          const author = document.createElement("strong");
          author.textContent = item.nickname || "익명";

          const date = document.createElement("small");
          date.textContent = " · " +
            new Date(item.created_at).toLocaleString("ko-KR");

          const content = document.createElement("p");
          content.textContent = item.content;

          article.append(author, date, content);
          list.appendChild(article);
        }
      } catch (error) {
        showMessage(error.message);
      }
    }

    function leaveRoom() {
      currentRoom = "";
      currentPassword = "";
      currentNickname = "";
      document.getElementById("roomForm").style.display = "block";
      document.getElementById("diary").style.display = "none";
      document.getElementById("entries").replaceChildren();
      document.getElementById("diaryText").value = "";
      showMessage("방에서 나왔어.");
    }
  </script>
</body>
</html>
